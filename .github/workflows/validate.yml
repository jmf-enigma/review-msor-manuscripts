name: Validate public skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate public release surface
        run: python3 scripts/validate_public_skill.py

      - name: Check changed lines for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" ]] &&
               [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
               git cat-file -e "$BEFORE_SHA^{commit}"; then
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          else
            git show --check --format= "$HEAD_SHA"
          fi
